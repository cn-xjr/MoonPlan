name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        uses: hustcer/setup-moonbit@v1
      - name: Check and test portable targets
        run: |
          moon version --all
          # Warning 79 is the current toolchain's implicit derive-method migration notice.
          moon check --target wasm --deny-warn --warn-list "-79"
          moon check --target wasm-gc --deny-warn --warn-list "-79"
          moon check --target js --deny-warn --warn-list "-79"
          moon test --target wasm --deny-warn --warn-list "-79"
          moon test --target wasm-gc --deny-warn --warn-list "-79"
          moon test --target js --deny-warn --warn-list "-79"
      - name: Check and test native target
        if: runner.os == 'Linux'
        run: |
          moon check --target native --deny-warn --warn-list "-79"
          moon test --target native --deny-warn --warn-list "-79"
      - name: Run examples and verify generated files
        run: |
          moon run --target wasm --deny-warn --warn-list "-79" cmd/main
          moon run --target wasm --deny-warn --warn-list "-79" cmd/week
          moon run --target wasm --deny-warn --warn-list "-79" cmd/benchmark
          moon run --target wasm --deny-warn --warn-list "-79" cmd/coverage_file -- --file examples/coverage_week.json --check
          moon run --target wasm --deny-warn --warn-list "-79" cmd/coverage_file -- --file examples/coverage_week.json --fair-node-limit 10000
          moon info
          moon fmt
          git diff --exit-code
